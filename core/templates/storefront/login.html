{% extends "storefront/base.html" %}
{% block title %}Sign In — ERP Shop{% endblock title %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-4 fw-bold"><i class="bi bi-box-arrow-in-right"></i> Sign In</h4>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" autofocus required>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>
        </form>

        <hr>
        <p class="text-center mb-0 small">
          No account? <a href="{% url 'store:signup' %}">Create one</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
